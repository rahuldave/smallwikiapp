[project]
name = "wikirandom"
version = "0.1.0"
description = "A random page of Wikipedia, in any language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
